<!doctype html>
<!--
  THE ROOM  ·  www.dizmar.xyz/room.html
  Página con la habitación 3D. Estilos en /css/room.css, lógica en /js/room.js.
  Aquí solo está la estructura: barra, lista de objetos (se rellena sola desde el JS), etiquetas y panel de detalle.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The room — Mario Diz</title>
  <meta name="description" content="An interactive 3D shelf of the things Mario Diz loves: the record playing now, the last film watched, a tomato lamp and more.">
  <link rel="canonical" href="https://www.dizmar.xyz/room.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="dizmar — Mario Diz">
  <meta property="og:title" content="The room — Mario Diz">
  <meta property="og:description" content="An interactive 3D shelf of the things Mario Diz loves: the record playing now, the last film watched, a tomato lamp and more.">
  <meta property="og:url" content="https://www.dizmar.xyz/room.html">
  <meta property="og:image" content="https://www.dizmar.xyz/assets/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/images/tomato.webp" type="image/webp">
  <link rel="preload" as="image" href="/assets/room/now-playing-sticker.webp">
  <link rel="preload" as="image" href="/assets/room/film-poster.webp">
  <link rel="stylesheet" href="/css/room.css?v=20261017b">
  <link rel="stylesheet" href="/css/nav-logo.css?v=20261020a">
  <link rel="stylesheet" href="/css/nav-links.css?v=20261020a">
<link rel="stylesheet" href="/css/transitions.css?v=20261020p">
  <script type="importmap">
    {"imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }}
  </script>
<script src="/js/transitions.js?v=20261020p"></script>
<link rel="stylesheet" href="/css/cursor.css?v=20261020d">
</head>
<body>
  <!-- Lienzo 3D de la habitación -->
  <canvas id="room" aria-label="Interactive shelf of personal interests"></canvas>
  <!-- Barra de navegación (igual que la de la home) -->
  <nav class="nav" aria-label="Main">
    <a class="nav-logo" href="/" aria-label="Home"><img src="/assets/images/tomato.webp" alt=""></a>
    <ul class="nav-links">
      <li><a href="/#work">Work</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/room.html" aria-current="page">Room</a></li>
    </ul>
  </nav>
  <!-- Título y lista de objetos de la izquierda (los botones los crea js/room.js) -->
  <section class="intro" aria-labelledby="room-title">
    <header class="intro-head">
      <h1 id="room-title">The room</h1>
    </header>
    <div class="object-nav" id="object-nav" aria-label="Objects in the room"></div>
  </section>
  <!-- Etiqueta flotante, pegatina de la canción y panel de detalle (los gestiona js/room.js) -->
  <div class="label" id="label" hidden></div>
  <div class="sticker-slot floating" id="track" hidden aria-hidden="true"></div>
  <aside class="detail" id="detail" hidden aria-live="polite">
    <button type="button" id="detail-close">Close ×</button>
    <h2 id="detail-title"></h2>
    <div id="detail-copy" class="detail-copy">This part of the room is being prepared.</div>
  </aside>
  <p class="status" id="status" role="status">Loading the room…</p>
  <script type="module" src="/js/room.js?v=20261020q"></script>
<script type="module" src="/js/nav-tomato.js?v=20261020b"></script>
<script src="/js/cursor.js?v=20261020c" defer></script>
</body>
</html>
