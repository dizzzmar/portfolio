<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The room — Mario Diz</title>
  <link rel="icon" href="/assets/tomato.webp" type="image/webp">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body { background: #140d09; color: #f3f0df; font-family: "Helvetica Neue", Arial, sans-serif; }
    #room { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    /* ---------- Nav bar: same as the landing page ---------- */
    :root { --nav-h: 64px; --panel: 380px; }
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 9; height: var(--nav-h); display: flex; align-items: center; gap: 16px; padding: 0 24px; pointer-events: none; }
    .nav > * { pointer-events: auto; }
    .nav-logo { flex: none; width: 44px; height: 44px; border-radius: 50%; }
    .nav-logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .nav-logo:focus-visible, .nav-links a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .nav-links { display: flex; gap: 32px; margin-left: auto; list-style: none; }
    .nav-links a { color: rgba(255, 255, 255, 0.78); font-size: 15px; text-decoration: none; text-shadow: 0 1px 8px rgba(0, 20, 40, 0.25); transition: color 0.2s, text-shadow 0.2s; }
    .nav-links a:hover, .nav-links a[aria-current="page"] { color: #fff; }

    /* ---------- Left column: title and the five objects; the room fills the rest ---------- */
    .intro { position: fixed; z-index: 2; top: calc(var(--nav-h) + 48px); left: 24px; width: calc(var(--panel) - 48px); pointer-events: none; }
    .intro h1 { font-size: clamp(40px, 4.4vw, 72px); font-weight: 700; letter-spacing: -0.055em; line-height: 0.95; text-transform: uppercase; }
    .intro .lede { margin-top: 6px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(22px, 2vw, 32px); letter-spacing: -0.04em; line-height: 1; text-transform: uppercase; color: #e9b48e; }
    .object-nav { margin-top: 40px; display: flex; flex-direction: column; align-items: start; gap: 2px; pointer-events: auto; }
    .object-nav button { appearance: none; border: 0; background: transparent; color: rgba(243, 240, 223, 0.72); font: inherit; font-size: 22px; letter-spacing: -0.02em; cursor: pointer; padding: 4px 0; transition: color 0.2s, transform 0.2s; }
    .object-nav button { position: relative; }
    .object-nav button::before { content: "→"; position: absolute; left: -1.1em; opacity: 0; transition: opacity 0.2s; }
    .object-nav button:hover, .object-nav button:focus-visible, .object-nav button.active { color: #ffc28f; }
    .object-nav button:hover::before, .object-nav button:focus-visible::before, .object-nav button.active::before { opacity: 1; }
    .object-nav button:focus-visible { outline: 2px solid #ffc28f; outline-offset: 4px; }
    .instructions { position: fixed; bottom: 24px; left: 24px; z-index: 2; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.5; opacity: 0.7; pointer-events: none; }
    .label { position: fixed; z-index: 3; left: calc(50% + var(--panel) / 2); bottom: 24px; transform: translateX(-50%); background: #f3f0df; color: #1a120c; box-shadow: 0 10px 30px #00000055, 0 0 24px #ffb27a44; padding: 10px 18px; font-size: 13px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
    .label[hidden], .detail[hidden] { display: none; }
    .detail { position: fixed; z-index: 4; inset: auto clamp(16px, 3vw, 48px) 24px auto; width: min(360px, calc(100vw - 32px)); padding: 24px; background: #f3f0df; color: #102f2b; box-shadow: 0 18px 45px #061c1a66; }
    .detail h2 { margin: 28px 0 8px; font-size: 30px; font-weight: 400; letter-spacing: -.05em; }
    .detail p { font-size: 14px; line-height: 1.4; }
    .detail button { border: 0; padding: 0; background: none; color: inherit; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
    .status { position: fixed; z-index: 2; top: 50%; left: calc(50% + var(--panel) / 2); transform: translate(-50%, -50%); text-align: center; max-width: 32ch; line-height: 1.4; }
    .status a { color: #ffc28f; text-underline-offset: 4px; }
    /* Phones and narrow windows: the room fills the screen, the list sits along the bottom */
    @media (max-width: 900px) {
      :root { --panel: 0px; }
      .intro { top: calc(var(--nav-h) + 16px); left: 14px; right: 14px; width: auto; }
      .intro h1 { font-size: 40px; }
      .intro .lede { font-size: 20px; }
      .object-nav { position: fixed; left: 14px; right: 14px; bottom: 16px; margin: 0; flex-direction: row; flex-wrap: wrap; gap: 4px 16px; }
      .object-nav button { font-size: 16px; }
      .object-nav button::before { display: none; }
      .instructions { display: none; }
      .label { bottom: 96px; }
      .detail { bottom: 96px; }
    }
    @media (max-width: 700px) {
      :root { --nav-h: 56px; }
      .nav { gap: 10px; padding: 0 14px; }
      .nav-logo { width: 36px; height: 36px; }
      .nav-links { gap: 14px; }
      .nav-links a { font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
  <script type="importmap">
    {"imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }}
  </script>
</head>
<body>
  <canvas id="room" aria-label="Interactive shelf of personal interests"></canvas>
  <nav class="nav" aria-label="Main">
    <a class="nav-logo" href="/" aria-label="Home"><img src="/assets/tomato.webp" alt=""></a>
    <ul class="nav-links">
      <li><a href="/#first-project">Work</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/contact">Contact</a></li>
      <li><a href="/room.html" aria-current="page">Room</a></li>
    </ul>
  </nav>
  <section class="intro" aria-labelledby="room-title">
    <h1 id="room-title">The room</h1>
    <p class="lede">Things I live with</p>
    <div class="object-nav" id="object-nav" aria-label="Objects in the room"></div>
  </section>
  <p class="instructions">Hover or click an object<br>Drag to look around</p>
  <div class="label" id="label" hidden></div>
  <aside class="detail" id="detail" hidden aria-live="polite">
    <button type="button" id="detail-close">Close ×</button>
    <h2 id="detail-title"></h2>
    <p id="detail-copy">This part of the room is being prepared.</p>
  </aside>
  <p class="status" id="status" role="status">Loading the room…</p>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const canvas = document.getElementById('room');
    const label = document.getElementById('label');
    const status = document.getElementById('status');
    const nav = document.getElementById('object-nav');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    // AgX is Blender's default view transform, so colours roll off like the Blender render
    renderer.toneMapping = THREE.AgXToneMapping;
    renderer.toneMappingExposure = 1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    // Cozy evening: dim warm ambience, a soft warm key from the front left,
    // a faint cool rim, and the tomato lamp doing most of the work (added on load).
    scene.background = new THREE.Color('#140d09');
    const reflections = new THREE.PMREMGenerator(renderer);
    scene.environment = reflections.fromScene(new RoomEnvironment(renderer)).texture;
    reflections.dispose();
    // three 0.160 has no scene.environmentIntensity, so the reflections are dimmed per material on load
    const ENV_INTENSITY = 0.06;
    scene.add(new THREE.HemisphereLight(0xffe2c4, 0x2a1a12, 0.13));
    const key = new THREE.DirectionalLight(0xffc89a, 0.25);
    key.position.set(-4, 5, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.0004;
    key.shadow.normalBias = 0.02;
    key.shadow.radius = 4;
    scene.add(key);
    scene.add(key.target);
    const rim = new THREE.DirectionalLight(0x8fb4ff, 0.18);
    rim.position.set(4, 3, -2);
    scene.add(rim);
    const camera = new THREE.PerspectiveCamera(35, 1, .1, 1000);
    const controls = new OrbitControls(camera, canvas);
    controls.enablePan = false;
    controls.enableDamping = true;
    controls.minAzimuthAngle = -.28;
    controls.maxAzimuthAngle = .28;
    controls.minPolarAngle = Math.PI / 2 - .2;
    controls.maxPolarAngle = Math.PI / 2 + .2;
    controls.minDistance = 1;
    controls.maxDistance = 10;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const outline = new OutlinePass(new THREE.Vector2(1, 1), scene, camera);
    outline.edgeStrength = 4;
    outline.edgeGlow = 0.8;
    outline.edgeThickness = 2;
    outline.visibleEdgeColor.set('#ffe6c4');
    outline.hiddenEdgeColor.set('#7a4a2a');
    composer.addPass(outline);
    // Soft glow around the brightest things (the lamp), like Blender's bloom
    // High threshold: only the emissive lamp is bright enough to bloom, not the lit wall
    const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.35, 0.4, 2.2);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    // Only these five things in the room can be selected. Add an href to one when
    // its section exists; until then it opens its own detail state.
    // Matched against object names reduced to lowercase words, because the loader
    // turns "Music / vinyl collection" into "Music__vinyl_collection".
    const destinations = [
      { label: 'Vinyls', key: 'vinyls', match: /^music (vinyl collection|displayed vinyl sleeve)\b/, href: null },
      { label: 'Mimikyu', key: 'mimikyu', match: /^mimikyu plush root$/, href: null },
      { label: 'Volver poster', key: 'volver-poster', match: /^wall upper left poster\b/, href: null },
      { label: 'Tomato lamp', key: 'tomato-lamp', match: /^lamp\b/, href: null },
      { label: 'Plant', key: 'plant', match: /^plants (eucalyptus|fluted vase)\b/, href: null },
    ];
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let meshes = [];
    let hovered = null;
    let down = null;
    const detail = document.getElementById('detail');
    const detailTitle = document.getElementById('detail-title');
    document.getElementById('detail-close').addEventListener('click', () => {
      detail.hidden = true;
      history.replaceState(null, '', location.pathname);
    });

    // The selectable thing a mesh (or any of its parents) belongs to, or null for the rest of the room
    const words = (name) => name.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    function destinationFor(object) {
      for (let current = object; current && current !== scene; current = current.parent) {
        const name = words(current.name);
        const found = destinations.find((item) => item.match.test(name));
        if (found) return found;
      }
      return null;
    }

    function pick(event) {
      const rect = canvas.getBoundingClientRect();
      pointer.set((event.clientX - rect.left) / rect.width * 2 - 1, -(event.clientY - rect.top) / rect.height * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(meshes, false)[0];
      if (!hit) return null;
      const item = destinationFor(hit.object);
      return item ? { item, object: hit.object } : null;
    }

    function highlight(selection) {
      hovered = selection;
      outline.selectedObjects = selection
        ? meshes.filter(mesh => destinationFor(mesh)?.key === selection.item.key)
        : [];
      label.hidden = !selection;
      for (const button of nav.querySelectorAll('button')) button.classList.toggle('active', !!selection && button.textContent === selection.item.label);
      if (selection) label.textContent = selection.item.label + ' +';
      canvas.style.cursor = selection ? 'pointer' : 'grab';
    }

    canvas.addEventListener('pointermove', event => {
      highlight(pick(event));
    });
    canvas.addEventListener('pointerleave', () => highlight(null));
    canvas.addEventListener('pointerdown', event => { down = [event.clientX, event.clientY]; });
    canvas.addEventListener('pointerup', event => {
      if (!down) return;
      const moved = Math.hypot(event.clientX - down[0], event.clientY - down[1]);
      down = null;
      if (moved < 8) {
        const selection = pick(event);
        if (selection) openItem(selection.item);
      }
    });
    canvas.addEventListener('pointercancel', () => { down = null; });

    function openItem(item) {
      if (item.href) {
        location.href = item.href;
        return;
      }
      detailTitle.textContent = item.label;
      detail.hidden = false;
      location.hash = item.key;
      document.getElementById('detail-close').focus();
    }

    new GLTFLoader().load('/assets/room/shelf.glb', gltf => {
      const model = gltf.scene;
      scene.add(model);
      model.updateMatrixWorld(true); // world positions are needed below to place the lamp light
      let tomato = null;
      model.traverse(object => {
        if (!object.isMesh) return;
        object.castShadow = true;
        object.receiveShadow = true;
        for (const material of [].concat(object.material)) material.envMapIntensity = ENV_INTENSITY;
        if (/^footwear\b/.test(words(object.name))) { object.visible = false; return; }
        if (/^room\b/.test(words(object.name))) return;
        if (/^lamp tomato diffuser\b/.test(words(object.name))) {
          tomato = object;
          // Deep red, lit from inside, under a glossy lacquer coat that catches the room
          object.material = new THREE.MeshPhysicalMaterial({
            color: '#c80000',
            emissive: '#ff0000',
            emissiveIntensity: 0.22, // low on purpose: AgX desaturates bright colours, so a dimmer glow stays redder
            roughness: 0.3,
            clearcoat: 1,
            clearcoatRoughness: 0.06,
            envMapIntensity: 0.25,   // enough for gloss; more turns the red pink
          });
          object.castShadow = false; // the light sits inside it
        }
        meshes.push(object);
      });
      if (tomato) {
        const center = new THREE.Box3().setFromObject(tomato).getCenter(new THREE.Vector3());
        // The lamp lights the wall and shelf in a warm pool, like the Blender render
        const lamp = new THREE.PointLight(0xff9a5c, 3.8, 0, 2);
        lamp.position.copy(center).add(new THREE.Vector3(0, .02, .12));
        lamp.castShadow = true;
        lamp.shadow.mapSize.set(1024, 1024);
        lamp.shadow.bias = -0.002;
        lamp.shadow.radius = 6;
        scene.add(lamp);
        lampFlicker = { light: lamp, material: tomato.material, intensity: lamp.intensity, glow: tomato.material.emissiveIntensity, start: null };
        if (!reduced) setLamp(0); // starts off, then flickers on once the room is shown
      }
      const bounds = new THREE.Box3().setFromObject(model);
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());
      const radius = Math.max(size.x, size.y * 1.5, size.z * 2);
      key.target.position.copy(center);
      controls.target.copy(center);
      roomFrame = { size, center };
      frameRoom();
      // Let the view swing a little further so the three-quarter angle is in range
      controls.minAzimuthAngle = -.45;
      controls.maxAzimuthAngle = .3;
      controls.update();
      status.remove();
      destinations.forEach(item => {
        if (!meshes.some(mesh => destinationFor(mesh) === item)) return;
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = item.label;
        button.addEventListener('focus', () => {
          const mesh = meshes.find(candidate => destinationFor(candidate) === item);
          highlight({ item, object: mesh });
        });
        button.addEventListener('blur', () => highlight(null));
        button.addEventListener('mouseenter', () => {
          const mesh = meshes.find(candidate => destinationFor(candidate) === item);
          highlight({ item, object: mesh });
        });
        button.addEventListener('mouseleave', () => highlight(null));
        button.addEventListener('click', () => {
          openItem(item);
        });
        nav.append(button);
      });
      resize(); // the list now has its final size, so frame the room around it
    }, undefined, () => {
      status.replaceChildren('The interactive shelf needs its web export. ', Object.assign(document.createElement('a'), {
        href: 'https://drive.google.com/file/d/1pM-4ozLStYv0whfZXHpRl56-pnqiBQid/view',
        textContent: 'View the Blender file in Drive ↗'
      }));
    });

    // ---------- Framing ----------
    // The free area for the room: right of the left column on desktop; between the
    // title and the object list on narrow screens. The camera keeps its three-quarter
    // angle and stands just far enough back for the room to fill that area.
    let roomFrame = null;
    function freeArea() {
      const width = innerWidth, height = innerHeight;
      const navH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--nav-h')) || 64;
      const panel = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--panel')) || 0;
      if (panel) return { left: panel, top: navH, right: 0, bottom: 24 };
      const intro = document.querySelector('.intro .lede').getBoundingClientRect();
      const list = document.getElementById('object-nav').getBoundingClientRect();
      return { left: 0, top: intro.bottom + 8, right: 0, bottom: list.height ? height - list.top + 8 : 24 };
    }
    function frameRoom() {
      if (!roomFrame) return;
      const { size, center } = roomFrame;
      const area = freeArea();
      const w = innerWidth - area.left - area.right, h = innerHeight - area.top - area.bottom;
      // Find the closest distance at which all 8 corners of the room's box land inside
      // the free area (with a 6% margin), by projecting them with a plain copy of the camera.
      const dir = new THREE.Vector3(-0.29, 0.1, 0.95).normalize(); // three-quarter, from front left, a little above
      const probe = new THREE.PerspectiveCamera(camera.fov, innerWidth / innerHeight, 0.01, 1000);
      const limX = (w / innerWidth) * 0.94, limY = (h / innerHeight) * 0.94;
      const half = size.clone().multiplyScalar(0.5);
      const corner = new THREE.Vector3();
      const fits = (d) => {
        probe.position.copy(center).addScaledVector(dir, d);
        probe.lookAt(center);
        probe.updateMatrixWorld();
        for (let i = 0; i < 8; i++) {
          corner.set(i & 1 ? half.x : -half.x, i & 2 ? half.y : -half.y, i & 4 ? half.z : -half.z).add(center).project(probe);
          if (Math.abs(corner.x) > limX || Math.abs(corner.y) > limY) return false;
        }
        return true;
      };
      let lo = size.length() * 0.2, hi = size.length() * 20;
      for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2; if (fits(mid)) hi = mid; else lo = mid; }
      const fit = hi;
      camera.position.copy(center).addScaledVector(dir, fit);
      controls.minDistance = fit * 0.85;
      controls.maxDistance = fit * 1.6;
      controls.update();
    }

    function resize() {
      const width = innerWidth, height = innerHeight;
      renderer.setSize(width, height, false);
      composer.setSize(width, height);
      bloom.setSize(width, height);
      camera.aspect = width / height;
      // Shift the picture so the room is centred in the free area, not the whole screen
      const area = freeArea();
      const dx = (area.left - area.right) / 2, dy = (area.top - area.bottom) / 2;
      if (dx || dy) camera.setViewOffset(width, height, -dx, -dy, width, height);
      else camera.clearViewOffset();
      camera.updateProjectionMatrix();
      frameRoom();
    }
    addEventListener('resize', resize);
    resize();
    // ---------- Lamp flicker on load ----------
    // Brightness keyframes [seconds, 0..1]: sputters a few times, then stays on
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const FLICKER = [[0, 0], [0.25, 0], [0.3, 0.9], [0.36, 0.05], [0.5, 0.05], [0.55, 0.6], [0.6, 0.15],
      [0.68, 1], [0.74, 0.3], [0.9, 0.3], [0.95, 0.95], [1.02, 0.55], [1.12, 1], [1.6, 1]];
    let lampFlicker = null;
    function setLamp(level) {
      lampFlicker.light.intensity = lampFlicker.intensity * level;
      lampFlicker.material.emissiveIntensity = lampFlicker.glow * level;
    }
    function flickerLevel(t) {
      for (let i = 1; i < FLICKER.length; i++) {
        const [t1, v1] = FLICKER[i];
        if (t <= t1) {
          const [t0, v0] = FLICKER[i - 1];
          const base = v0 + (v1 - v0) * ((t - t0) / (t1 - t0));
          return Math.max(0, Math.min(1, base + (Math.random() - 0.5) * 0.12 * base)); // a little buzz
        }
      }
      return 1;
    }

    let lastFrame = performance.now();
    function frame() {
      const now = performance.now();
      // Advance at most 50ms per frame, so a slow first frame (shaders, shadows)
      // doesn't skip the flicker: it just plays a little slower.
      const dt = Math.min((now - lastFrame) / 1000, 0.05);
      lastFrame = now;
      if (lampFlicker && !reduced && lampFlicker.start !== false) {
        lampFlicker.t = lampFlicker.start === null ? 0 : lampFlicker.t + dt;
        lampFlicker.start = true;
        setLamp(flickerLevel(lampFlicker.t));
        if (lampFlicker.t > FLICKER[FLICKER.length - 1][0]) { setLamp(1); lampFlicker.start = false; }
      }
      controls.update();
      composer.render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
