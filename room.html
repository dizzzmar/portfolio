<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The room — Mario Diz</title>
  <link rel="icon" href="/assets/tomato.webp" type="image/webp">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #140d09; color: #f3f0df; font-family: "Helvetica Neue", Arial, sans-serif; }
    #room { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .topbar { position: fixed; z-index: 2; inset: 0 0 auto; display: flex; justify-content: space-between; align-items: start; padding: 22px clamp(16px, 3vw, 48px); pointer-events: none; }
    .topbar a { color: inherit; text-decoration: none; pointer-events: auto; }
    .topbar a:hover, .topbar a:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
    .topbar span, .instructions { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .instructions { position: fixed; bottom: 24px; left: clamp(16px, 3vw, 48px); z-index: 2; line-height: 1.5; pointer-events: none; }
    .label { position: fixed; z-index: 3; left: 50%; bottom: 24px; transform: translateX(-50%); background: #f3f0df; color: #1a120c; box-shadow: 0 10px 30px #00000055, 0 0 24px #ffb27a44; padding: 10px 18px; font-size: 13px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
    .label[hidden], .detail[hidden] { display: none; }
    .detail { position: fixed; z-index: 4; inset: auto clamp(16px, 3vw, 48px) 24px auto; width: min(360px, calc(100vw - 32px)); padding: 24px; background: #f3f0df; color: #102f2b; box-shadow: 0 18px 45px #061c1a66; }
    .detail h2 { margin: 28px 0 8px; font-size: 30px; font-weight: 400; letter-spacing: -.05em; }
    .detail p { font-size: 14px; line-height: 1.4; }
    .detail button { border: 0; padding: 0; background: none; color: inherit; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
    .status { position: fixed; z-index: 2; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; max-width: 32ch; line-height: 1.4; }
    .status a { color: #91c9ff; text-underline-offset: 4px; }
    .object-nav { position: fixed; z-index: 2; right: clamp(16px, 3vw, 48px); bottom: 24px; display: flex; flex-direction: column; align-items: end; gap: 4px; }
    .object-nav button { appearance: none; border: 0; background: transparent; color: #f3f0df; font: inherit; font-size: 12px; cursor: pointer; padding: 5px; }
    .object-nav button:hover, .object-nav button:focus-visible { color: #ffc28f; outline: 2px solid #ffc28f; outline-offset: 2px; }
    @media (max-width: 700px) { .instructions { bottom: 16px; max-width: 42%; } .object-nav { bottom: 16px; } .label { bottom: 150px; } .detail { bottom: 150px; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
  <script type="importmap">
    {"imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }}
  </script>
</head>
<body>
  <canvas id="room" aria-label="Interactive shelf of personal interests"></canvas>
  <header class="topbar"><a href="/index.html">← Back</a><span>Mario Diz / The room</span></header>
  <p class="instructions">Move to explore<br>Click an object to open<br>Drag to look around</p>
  <div class="object-nav" id="object-nav" aria-label="Explore objects"></div>
  <div class="label" id="label" hidden></div>
  <aside class="detail" id="detail" hidden aria-live="polite">
    <button type="button" id="detail-close">Close ×</button>
    <h2 id="detail-title"></h2>
    <p id="detail-copy">This part of the room is being prepared.</p>
  </aside>
  <p class="status" id="status" role="status">Loading the room…</p>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const canvas = document.getElementById('room');
    const label = document.getElementById('label');
    const status = document.getElementById('status');
    const nav = document.getElementById('object-nav');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    // AgX is Blender's default view transform, so colours roll off like the Blender render
    renderer.toneMapping = THREE.AgXToneMapping;
    renderer.toneMappingExposure = 1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    // Cozy evening: dim warm ambience, a soft warm key from the front left,
    // a faint cool rim, and the tomato lamp doing most of the work (added on load).
    scene.background = new THREE.Color('#140d09');
    const reflections = new THREE.PMREMGenerator(renderer);
    scene.environment = reflections.fromScene(new RoomEnvironment(renderer)).texture;
    reflections.dispose();
    // three 0.160 has no scene.environmentIntensity, so the reflections are dimmed per material on load
    const ENV_INTENSITY = 0.06;
    scene.add(new THREE.HemisphereLight(0xffe2c4, 0x2a1a12, 0.13));
    const key = new THREE.DirectionalLight(0xffc89a, 0.25);
    key.position.set(-4, 5, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.0004;
    key.shadow.normalBias = 0.02;
    key.shadow.radius = 4;
    scene.add(key);
    scene.add(key.target);
    const rim = new THREE.DirectionalLight(0x8fb4ff, 0.18);
    rim.position.set(4, 3, -2);
    scene.add(rim);
    const camera = new THREE.PerspectiveCamera(35, 1, .1, 1000);
    const controls = new OrbitControls(camera, canvas);
    controls.enablePan = false;
    controls.enableDamping = true;
    controls.minAzimuthAngle = -.28;
    controls.maxAzimuthAngle = .28;
    controls.minPolarAngle = Math.PI / 2 - .2;
    controls.maxPolarAngle = Math.PI / 2 + .2;
    controls.minDistance = 1;
    controls.maxDistance = 10;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const outline = new OutlinePass(new THREE.Vector2(1, 1), scene, camera);
    outline.edgeStrength = 4;
    outline.edgeGlow = 0.8;
    outline.edgeThickness = 2;
    outline.visibleEdgeColor.set('#ffe6c4');
    outline.hiddenEdgeColor.set('#7a4a2a');
    composer.addPass(outline);
    // Soft glow around the brightest things (the lamp), like Blender's bloom
    // High threshold: only the emissive lamp is bright enough to bloom, not the lit wall
    const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.35, 0.4, 2.2);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    // Only these five things in the room can be selected. Add an href to one when
    // its section exists; until then it opens its own detail state.
    // Matched against object names reduced to lowercase words, because the loader
    // turns "Music / vinyl collection" into "Music__vinyl_collection".
    const destinations = [
      { label: 'Vinyls', key: 'vinyls', match: /^music (vinyl collection|displayed vinyl sleeve)\b/, href: null },
      { label: 'Mimikyu', key: 'mimikyu', match: /^mimikyu plush root$/, href: null },
      { label: 'Volver poster', key: 'volver-poster', match: /^wall upper left poster\b/, href: null },
      { label: 'Tomato lamp', key: 'tomato-lamp', match: /^lamp\b/, href: null },
      { label: 'Plant', key: 'plant', match: /^plants (eucalyptus|fluted vase)\b/, href: null },
    ];
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let meshes = [];
    let hovered = null;
    let down = null;
    const detail = document.getElementById('detail');
    const detailTitle = document.getElementById('detail-title');
    document.getElementById('detail-close').addEventListener('click', () => {
      detail.hidden = true;
      history.replaceState(null, '', location.pathname);
    });

    // The selectable thing a mesh (or any of its parents) belongs to, or null for the rest of the room
    const words = (name) => name.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    function destinationFor(object) {
      for (let current = object; current && current !== scene; current = current.parent) {
        const name = words(current.name);
        const found = destinations.find((item) => item.match.test(name));
        if (found) return found;
      }
      return null;
    }

    function pick(event) {
      const rect = canvas.getBoundingClientRect();
      pointer.set((event.clientX - rect.left) / rect.width * 2 - 1, -(event.clientY - rect.top) / rect.height * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(meshes, false)[0];
      if (!hit) return null;
      const item = destinationFor(hit.object);
      return item ? { item, object: hit.object } : null;
    }

    function highlight(selection) {
      hovered = selection;
      outline.selectedObjects = selection
        ? meshes.filter(mesh => destinationFor(mesh)?.key === selection.item.key)
        : [];
      label.hidden = !selection;
      if (selection) label.textContent = selection.item.label + ' +';
      canvas.style.cursor = selection ? 'pointer' : 'grab';
    }

    canvas.addEventListener('pointermove', event => {
      highlight(pick(event));
    });
    canvas.addEventListener('pointerleave', () => highlight(null));
    canvas.addEventListener('pointerdown', event => { down = [event.clientX, event.clientY]; });
    canvas.addEventListener('pointerup', event => {
      if (!down) return;
      const moved = Math.hypot(event.clientX - down[0], event.clientY - down[1]);
      down = null;
      if (moved < 8) {
        const selection = pick(event);
        if (selection) openItem(selection.item);
      }
    });
    canvas.addEventListener('pointercancel', () => { down = null; });

    function openItem(item) {
      if (item.href) {
        location.href = item.href;
        return;
      }
      detailTitle.textContent = item.label;
      detail.hidden = false;
      location.hash = item.key;
      document.getElementById('detail-close').focus();
    }

    new GLTFLoader().load('/assets/room/shelf.glb', gltf => {
      const model = gltf.scene;
      scene.add(model);
      model.updateMatrixWorld(true); // world positions are needed below to place the lamp light
      let tomato = null;
      model.traverse(object => {
        if (!object.isMesh) return;
        object.castShadow = true;
        object.receiveShadow = true;
        for (const material of [].concat(object.material)) material.envMapIntensity = ENV_INTENSITY;
        if (/^footwear\b/.test(words(object.name))) { object.visible = false; return; }
        if (/^room\b/.test(words(object.name))) return;
        if (/^lamp tomato diffuser\b/.test(words(object.name))) {
          tomato = object;
          object.material = object.material.clone();
          object.material.color.set('#df4532');
          object.material.emissive.set('#ff4a1c');
          object.material.emissiveIntensity = 1.1; // strong enough to glow, low enough to stay red
          object.castShadow = false; // the light sits inside it
          object.material.roughness = .42;
        }
        meshes.push(object);
      });
      if (tomato) {
        const center = new THREE.Box3().setFromObject(tomato).getCenter(new THREE.Vector3());
        // The lamp lights the wall and shelf in a warm pool, like the Blender render
        const lamp = new THREE.PointLight(0xff9a5c, 3.8, 0, 2);
        lamp.position.copy(center).add(new THREE.Vector3(0, .02, .12));
        lamp.castShadow = true;
        lamp.shadow.mapSize.set(1024, 1024);
        lamp.shadow.bias = -0.002;
        lamp.shadow.radius = 6;
        scene.add(lamp);
      }
      const bounds = new THREE.Box3().setFromObject(model);
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());
      const radius = Math.max(size.x, size.y * 1.5, size.z * 2);
      // Three-quarter view from the front left and a little above, framed tighter
      key.target.position.copy(center);
      camera.position.set(center.x - radius * .42, center.y + radius * .18, center.z + radius * 1.45);
      controls.target.copy(center);
      controls.minDistance = radius * 1.05;
      controls.maxDistance = radius * 2.1;
      // Let the view swing a little further so the three-quarter angle is in range
      controls.minAzimuthAngle = -.45;
      controls.maxAzimuthAngle = .3;
      controls.update();
      status.remove();
      destinations.forEach(item => {
        if (!meshes.some(mesh => destinationFor(mesh) === item)) return;
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = item.label;
        button.addEventListener('focus', () => {
          const mesh = meshes.find(candidate => destinationFor(candidate) === item);
          highlight({ item, object: mesh });
        });
        button.addEventListener('blur', () => highlight(null));
        button.addEventListener('click', () => {
          openItem(item);
        });
        nav.append(button);
      });
    }, undefined, () => {
      status.replaceChildren('The interactive shelf needs its web export. ', Object.assign(document.createElement('a'), {
        href: 'https://drive.google.com/file/d/1pM-4ozLStYv0whfZXHpRl56-pnqiBQid/view',
        textContent: 'View the Blender file in Drive ↗'
      }));
    });

    function resize() {
      const width = innerWidth, height = innerHeight;
      renderer.setSize(width, height, false);
      composer.setSize(width, height);
      bloom.setSize(width, height);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();
    function frame() {
      controls.update();
      composer.render();
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>
