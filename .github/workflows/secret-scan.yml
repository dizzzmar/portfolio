# Comprueba en cada push y en cada PR que no se ha subido ninguna clave, token o contraseña.
# Usa gitleaks (https://github.com/gitleaks/gitleaks). Si encuentra algo, la comprobación sale en rojo
# en la PR: no fusiones y revoca/cambia esa clave en su servicio.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # todo el historial, no solo el último commit
      - name: Buscar secretos con gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose --exit-code 1
