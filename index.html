<body class="intro-lock" data-intro="auto"> <!-- data-intro="auto": al cargar, el tomate sube solo al menú (ver js/home-tomato.js) -->
  <div class="sky" aria-hidden="true"></div>
  <!-- Lienzo del tomate 3D (lo dibuja /js/home-tomato.js) -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- ========== 1. Navegación ========== -->
  <nav class="nav" aria-label="Main">
    <a class="nav-logo" href="#top" aria-label="Back to top"></a>

      <li><a href="/contact">Contact</a></li>
      <li><a href="/room.html">Room</a></li>
    </ul>
  </nav>

  <main id="top">
    <!-- ========== 2. Hero: el tomate (canvas de arriba) flota aquí ========== -->
    <section class="hero" aria-labelledby="site-title">
      <!-- El nombre que dibuja el tomate 3D, escrito también como texto para buscadores y lectores de pantalla -->
      <h1 class="sr-only" id="site-title">Mario Diz — art direction &amp; visual design, Madrid</h1>
      <!-- Tomate plano que se ve al instante mientras carga el 3D (luego se funde con él) -->
      <img class="tomato-placeholder" src="/assets/images/tomato.webp" width="595" height="640" alt="" aria-hidden="true" fetchpriority="high">
      <div class="scroll-hint" id="hint" hidden>Scroll</div> <!-- oculto: el tomate sube solo -->
      <!-- Cuando el tomate llega al menú aparece "Creative ___" y la segunda palabra cambia muy rápido.
           EDITA la lista de palabras en js/home-intro.js -->
      <p class="intro-line" aria-hidden="true"><span>Creative</span> <span class="intro-word">Designer</span></p>
    </section>

    <!-- ========== 3. Work (referencia: collectiveinterest.de/work) ==========
         Fondo blanco. A la izquierda, la imagen del proyecto sobre el que está el ratón; a la derecha, la lista.
         En el móvil cada proyecto lleva su imagen encima.
         Para AÑADIR un proyecto: copia un <li class="work-item"> (con su data-media) y añade su imagen o vídeo
         en <div class="work-preview"> con el mismo data-media. El orden en el código es el orden en la página. -->
    <section class="work-list" id="work" aria-labelledby="work-title">
      <h2 class="sr-only" id="work-title">Selected work</h2>
      <div class="work-preview" aria-hidden="true">
        <video data-media="lexus" class="is-active" src="/assets/projects/lexus-electrified/thumb.mp4" poster="/assets/projects/lexus-electrified/thumb.webp" width="1280" height="720" muted loop playsinline autoplay preload="metadata"></video>
        <img data-media="soap" src="/assets/projects/soap-and-glory-vanilla/sg3-1600.webp" srcset="/assets/projects/soap-and-glory-vanilla/sg3-800.webp 800w, /assets/projects/soap-and-glory-vanilla/sg3-1600.webp 1600w" sizes="36vw" width="1600" height="1600" loading="lazy" alt="">
      </div>
      <ul class="work-rows">
        <li class="work-item" data-media="lexus">
          <a href="/project/lexus-electrified/">
            <img class="work-thumb" src="/assets/projects/lexus-electrified/thumb.webp" width="1280" height="720" loading="lazy" alt="">
            <span class="work-title">Lexus x Electrified</span><span class="work-type">Audiovisual</span><span class="work-year">2025</span>
          </a>
        </li>
        <li class="work-item" data-media="soap">
          <a href="/project/soap-and-glory-vanilla/">
            <img class="work-thumb" src="/assets/projects/soap-and-glory-vanilla/sg3-800.webp" width="800" height="800" loading="lazy" alt="">
            <span class="work-title">Soap &amp; Glory x Vanillalicious</span><span class="work-type">Key visuals</span><span class="work-year"></span> <!-- EDITA: el año -->
          </a>
        </li>
      </ul>
    </section>
  </main>
