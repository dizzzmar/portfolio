<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dizmar</title>
  <link rel="icon" href="/assets/tomato.webp" type="image/webp">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      color: #fff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #8cc0ef;
    }

    /* Sky photo, oversized so it can drift slowly without showing its edges */
    .sky {
      position: fixed;
      inset: -8%;
      z-index: -1;
      background:
        url("/assets/sky.webp") center / cover,
        linear-gradient(to bottom, #4f8fd8 0%, #8cc0ef 55%, #d8ecfb 100%);
      animation: drift 40s ease-in-out infinite alternate;
      will-change: transform;
    }

    /* Film grain: stays still on top of the moving sky */
    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: url("/assets/grain.png") repeat;
      background-size: 128px 128px;
      mix-blend-mode: overlay;
      opacity: 0.32;
    }

    @keyframes drift {
      0%   { transform: translate(-3%, 1%) scale(1); }
      50%  { transform: translate(1%, -1.5%) scale(1.04); }
      100% { transform: translate(3%, 1%) scale(1.02); }
    }

    /* The tomato canvas covers the viewport and ignores the pointer */
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* ---------- Sections (placeholders to fill later) ---------- */
    .hero {
      height: 100vh;
      height: 100dvh;
      position: relative;
    }

    .scroll-hint {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.85;
      transition: opacity 0.3s;
    }

    .scroll-hint::after {
      content: "";
      display: block;
      width: 1px;
      height: 32px;
      margin: 10px auto 0;
      background: currentColor;
      animation: drip 1.6s ease-in-out infinite;
      transform-origin: top;
    }

    @keyframes drip {
      0%   { transform: scaleY(0); }
      50%  { transform: scaleY(1); }
      100% { transform: scaleY(1); opacity: 0; }
    }

    .content {
      min-height: 100vh;
      padding: 160px 16px 96px;
      display: grid;
      place-items: center;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .scroll-hint::after, .sky { animation: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <canvas id="scene" aria-hidden="true"></canvas>

  <main>
    <section class="hero" aria-label="dizmar">
      <div class="scroll-hint" id="hint">Scroll</div>
    </section>

    <section class="content" id="content">
      <!-- Content goes here -->
    </section>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const canvas = document.getElementById('scene');
    const hint = document.getElementById('hint');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
    camera.position.set(0, 0, 10);

    // The model uses an unlit baked texture, so it needs no lights.
    const pivot = new THREE.Group(); // moved around the screen
    const spinner = new THREE.Group(); // rotates in place
    pivot.add(spinner);
    scene.add(pivot);

    new GLTFLoader().load('/assets/tomato.glb', (gltf) => {
      const model = gltf.scene;
      // Center the model and normalize it to a height of 1 unit
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      model.position.sub(box.getCenter(new THREE.Vector3()));
      const holder = new THREE.Group();
      holder.add(model);
      holder.scale.setScalar(1 / Math.max(size.x, size.y, size.z));
      spinner.add(holder);
    });

    // ---------- Layout ----------
    // Hero: centered and large. Docked: small, in the top-left corner.
    let width = 0, height = 0;

    function resize() {
      width = innerWidth;
      height = innerHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    // World units visible per pixel at the z = 0 plane
    function unitsPerPixel() {
      const visibleHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
      return visibleHeight / height;
    }

    function layout(progress) {
      const upp = unitsPerPixel();
      const heroPx = Math.min(width, height) * 0.5; // tomato size in the hero
      const dockPx = width < 640 ? 72 : 110;        // tomato size when docked
      const margin = width < 640 ? 16 : 28;

      const sizePx = THREE.MathUtils.lerp(heroPx, dockPx, progress);
      // Screen position of the tomato's center, in pixels from the top-left
      const xPx = THREE.MathUtils.lerp(width / 2, margin + dockPx / 2, progress);
      const yPx = THREE.MathUtils.lerp(height / 2, margin + dockPx / 2, progress);

      pivot.scale.setScalar(sizePx * upp);
      pivot.position.set((xPx - width / 2) * upp, (height / 2 - yPx) * upp, 0);
    }

    // ---------- Animation ----------
    const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    let shown = 0; // smoothed scroll progress
    const clock = new THREE.Clock();

    function frame() {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      // 0 at the top of the page, 1 after scrolling 80% of a screen
      const target = Math.min(Math.max(scrollY / (height * 0.8), 0), 1);
      shown += (target - shown) * (reduced ? 1 : 1 - Math.exp(-dt * 8));
      layout(ease(shown));

      // Keep spinning, with a gentle flying wobble
      spinner.rotation.y += dt * (reduced ? 0.3 : 0.9);
      if (!reduced) {
        spinner.rotation.x = Math.sin(t * 0.8) * 0.18;
        spinner.rotation.z = Math.sin(t * 0.6) * 0.12;
        spinner.position.y = Math.sin(t * 1.4) * 0.06;
      }

      hint.style.opacity = shown > 0.05 ? 0 : 0.85;
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
