<!-- PLAYGROUND › ISLAND · el pequeño mundo isométrico en pixel art (js/about-scene.js) a pantalla completa, con tres personas que viven allí; se llega desde el menú de /playground/.
     Controles (js/island.js): hora del día, tiempo y zoom como píldoras; la rueda o el pellizco acercan, arrastrar recorre la isla. Los nombres para lectores de pantalla van en aria-label. -->
<div class="case-head">
  <h1 class="case-name"><a class="case-back" href="/playground/" aria-label="Island — back to Playground">Island</a></h1>
</div>

<main class="island-stage" data-island>
  <canvas class="scene-canvas" role="img" aria-label="Pixel-art isometric scene: a floating island with a cottage, a vegetable garden, a pond with ducks and a waterfall, a terrace with beehives, a campfire and an outdoor office, where three people work, garden, fish, chat and go to bed as the day goes by."></canvas>
  <noscript><p class="island-note">The island needs JavaScript.</p></noscript>
</main>
<div class="scene-ui" role="group" aria-label="Scene controls">
  <div class="sui-dock">
    <div class="sui-row" role="group" aria-label="Time of day">
      <button class="sui-pill" type="button" data-time="0" aria-pressed="false">Morning</button>
      <button class="sui-pill" type="button" data-time="1" aria-pressed="false">Day</button>
      <button class="sui-pill" type="button" data-time="2" aria-pressed="false">Sunset</button>
      <button class="sui-pill" type="button" data-time="3" aria-pressed="false">Night</button>
      <button class="sui-pill sui-live" type="button" data-follow aria-pressed="true" aria-label="Follow the time in Madrid">Now</button>
    </div>
    <div class="sui-row" role="group" aria-label="Weather">
      <button class="sui-pill" type="button" data-weather="0" aria-pressed="false">Clear</button>
      <button class="sui-pill" type="button" data-weather="1" aria-pressed="false">Cloudy</button>
      <button class="sui-pill" type="button" data-weather="2" aria-pressed="false">Rain</button>
      <button class="sui-pill sui-live" type="button" data-auto aria-pressed="true" aria-label="Let the weather change by itself">Auto</button>
    </div>
  </div>
  <div class="sui-zoom" role="group" aria-label="Zoom">
    <button class="sui-pill sui-round" type="button" data-zoom="-1" aria-label="Zoom out"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9"/></svg></button>
    <button class="sui-pill sui-round" type="button" data-zoom="1" aria-label="Zoom in"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9"/></svg></button>
  </div>
</div>
