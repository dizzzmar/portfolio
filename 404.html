<!doctype html>
<!--
  404  ·  Página "no encontrada" (GitHub Pages la muestra cuando una URL no existe).
  Estilos en /css/not-found.css, tomate 3D en /js/not-found-tomato.js.
  Para cambiar el texto: edita <p class="message"> más abajo.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page not found · dizmar</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/images/tomato.webp" type="image/webp">
  <link rel="stylesheet" href="/css/not-found.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <script src="/js/not-found-sky.js"></script>
  <div class="grain" aria-hidden="true"></div>

  <main class="stage">
    <h1 class="code" aria-label="404">
      <span class="digit" aria-hidden="true">4</span>
      <span class="zero" id="zero" aria-hidden="true">
        <!-- Shown until the 3D tomato is ready, or if WebGL isn't available -->
        <img src="/assets/images/tomato.webp" alt="">
        <canvas id="tomato"></canvas>
      </span>
      <span class="digit" aria-hidden="true">4</span>
    </h1>
    <p class="message">This page doesn't exist. Maybe it's still cooking.</p>
    <a class="home" href="/">Back to home</a>
  </main>

  <script src="/js/not-found-entrance.js"></script>

  <script type="module" src="/js/not-found-tomato.js"></script>
</body>
</html>
