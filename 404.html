<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Under construction · dizmar</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/tomato.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #3f7fd6;
      --text: #ffffff;
      --dim: rgba(255, 255, 255, 0.82);
      --accent: #ffeb00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--sky);
      color: var(--text);
      font-family: "VT323", "Courier New", monospace;
      overflow: hidden;
    }

    /* Same drifting sky as the homepage, oversized so its edges never show */
    .sky {
      position: fixed;
      inset: -8%;
      z-index: -1;
      background:
        url("/assets/sky.webp") center / cover,
        linear-gradient(to bottom, #4f8fd8 0%, #8cc0ef 55%, #d8ecfb 100%);
      animation: drift 40s ease-in-out infinite alternate;
      will-change: transform;
    }

    /* Film grain: stays still on top of the moving sky */
    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: url("/assets/grain.png") repeat;
      background-size: 128px 128px;
      mix-blend-mode: overlay;
      opacity: 0.32;
    }

    @keyframes drift {
      0%   { transform: translate(-3%, 1%) scale(1); }
      50%  { transform: translate(1%, -1.5%) scale(1.04); }
      100% { transform: translate(3%, 1%) scale(1.02); }
    }

    /* CRT scanlines + vignette */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      background:
        repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.12) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 20, 0.45) 100%);
    }

    /* ---------- Terminal ---------- */
    .terminal {
      position: relative;
      z-index: 2;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px clamp(16px, 6vw, 96px);
      /* Dark shadow keeps the text readable over white clouds */
      text-shadow: 0 2px 0 rgba(0, 20, 70, 0.35), 0 0 18px rgba(0, 20, 70, 0.45);
      user-select: none;
    }

    .log {
      font-size: clamp(18px, 2vw, 26px);
      line-height: 1.35;
      color: var(--dim);
      margin-bottom: 0.8em;
      white-space: pre-wrap;
      min-height: 4.05em;
      overflow-wrap: anywhere;
    }

    .log .ok { color: var(--accent); }

    .big {
      font-size: clamp(56px, 11vw, 190px);
      line-height: 0.9;
      text-transform: uppercase;
      color: var(--text);
      white-space: pre-wrap;
      min-height: 1.8em;
    }

    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 0.85em;
      margin-left: 0.04em;
      vertical-align: -0.06em;
      background: currentColor;
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink { to { visibility: hidden; } }

    /* ---------- Tomatoes ---------- */
    .tomato {
      position: absolute;
      width: var(--s);
      left: var(--x);
      top: var(--y);
      z-index: var(--z, 1);
      transform: translate(-50%, -50%) rotate(var(--r, 0deg));
      cursor: grab;
      touch-action: none;
      filter: drop-shadow(0 18px 24px rgba(0, 0, 30, 0.45));
    }

    .tomato img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      animation: bob var(--d, 6s) ease-in-out var(--delay, 0s) infinite alternate;
    }

    .tomato.dragging { cursor: grabbing; z-index: 30; }
    .tomato.dragging img { animation-play-state: paused; }

    @keyframes bob {
      from { transform: translateY(-10px) rotate(-4deg); }
      to   { transform: translateY(12px) rotate(5deg); }
    }

    @media (max-width: 640px) {
      .big { font-size: 15vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tomato img, .cursor, .sky { animation: none; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <main class="terminal" aria-label="404 — Something's cooking. Under construction.">
    <div class="log" id="log" aria-hidden="true"></div>
    <div class="big" id="big" aria-hidden="true"></div>
  </main>

  <!-- Tomatoes: position (x,y), size, rotation, stacking and float timing -->
  <div class="tomato" style="--x:80%; --y:16%; --s:clamp(110px,15vw,240px); --r:-18deg; --d:5.5s"><img src="/assets/tomato.webp" alt=""></div>
  <div class="tomato" style="--x:92%; --y:58%; --s:clamp(130px,19vw,320px); --r:14deg; --d:7s; --delay:-2s"><img src="/assets/tomato.webp" alt=""></div>
  <div class="tomato" style="--x:10%; --y:96%; --s:clamp(140px,20vw,340px); --r:22deg; --d:8s; --delay:-3s"><img src="/assets/tomato.webp" alt=""></div>
  <div class="tomato" style="--x:62%; --y:90%; --s:clamp(90px,12vw,190px); --r:-30deg; --d:6.5s; --delay:-4s"><img src="/assets/tomato.webp" alt=""></div>
  <div class="tomato" style="--x:6%;  --y:10%; --s:clamp(80px,9vw,150px); --r:40deg; --d:5s; --delay:-2.5s"><img src="/assets/tomato.webp" alt=""></div>

  <script>
    // Terminal typing sequence. Log lines are small; the headline is typed big.
    const path = location.pathname;
    const logLines = [
      { text: `C:\\DIZMAR> cd ${path}` },
      { text: 'ERROR 404: page not found.' },
      { text: 'C:\\DIZMAR> status' },
      { text: '[ OK ] tomatoes loaded', cls: 'ok' },
    ];
    const headline = "Something's\ncooking.\nUnder construction";

    const log = document.getElementById('log');
    const big = document.getElementById('big');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const wait = (ms) => new Promise((r) => setTimeout(r, reduced ? 0 : ms));

    async function type(target, text, speed) {
      target.appendChild(cursor);
      for (const ch of text) {
        cursor.before(ch);
        await wait(speed + Math.random() * speed);
      }
    }

    (async () => {
      await wait(500);
      for (const line of logLines) {
        const row = document.createElement('div');
        if (line.cls) row.className = line.cls;
        log.appendChild(row);
        await type(row, line.text, 28);
        await wait(350);
      }
      await wait(400);
      await type(big, headline, 70);
    })();

    // Drag the tomatoes around with mouse or touch.
    document.querySelectorAll('.tomato').forEach((el) => {
      let startX, startY, originX, originY;

      el.addEventListener('pointerdown', (e) => {
        el.setPointerCapture(e.pointerId);
        el.classList.add('dragging');
        startX = e.clientX;
        startY = e.clientY;
        originX = el.offsetLeft;
        originY = el.offsetTop;
      });

      el.addEventListener('pointermove', (e) => {
        if (!el.classList.contains('dragging')) return;
        el.style.left = originX + e.clientX - startX + 'px';
        el.style.top = originY + e.clientY - startY + 'px';
      });

      const drop = () => el.classList.remove('dragging');
      el.addEventListener('pointerup', drop);
      el.addEventListener('pointercancel', drop);
    });
  </script>
</body>
</html>
