<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page not found · dizmar</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/tomato.webp" type="image/webp">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      overflow: hidden;
      color: #fff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #3f7fd6;
    }

    /* Same drifting sky as the homepage, oversized so its edges never show */
    .sky {
      position: fixed;
      inset: -8%;
      z-index: -1;
      background:
        url("/assets/sky.webp") center / cover,
        linear-gradient(to bottom, #4f8fd8 0%, #8cc0ef 55%, #d8ecfb 100%);
      animation: drift 40s ease-in-out infinite alternate;
      will-change: transform;
    }

    /* Film grain: stays still on top of the moving sky */
    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: url("/assets/grain.png") repeat;
      background-size: 128px 128px;
      mix-blend-mode: overlay;
      opacity: 0.32;
    }

    @keyframes drift {
      0%   { transform: translate(-3%, 1%) scale(1); }
      50%  { transform: translate(1%, -1.5%) scale(1.04); }
      100% { transform: translate(3%, 1%) scale(1.02); }
    }

    /* ---------- Page ---------- */
    .stage {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px 16px;
      text-align: center;
    }

    /* "4 [tomato] 4": the tomato stands in for the 0 */
    .code {
      display: flex;
      align-items: center;
      font-size: clamp(110px, min(32vw, 46vh), 440px); /* also fits short, wide screens */
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      text-shadow: 0 6px 30px rgba(0, 30, 80, 0.25);
      user-select: none;
    }

    .zero {
      position: relative;
      width: 0.74em;
      height: 0.74em;
      margin: 0 0.04em;
    }

    /* The canvas is larger than the slot so the wobble never clips */
    .zero canvas,
    .zero img {
      position: absolute;
      inset: -20%;
      width: 140%;
      height: 140%;
    }

    .zero img {
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(0, 30, 80, 0.3));
      transition: opacity 0.4s;
    }

    .zero.ready img { opacity: 0; }

    .message {
      max-width: 40ch;
      font-size: clamp(16px, 1.6vw, 20px);
      line-height: 1.4;
      text-shadow: 0 1px 10px rgba(0, 30, 80, 0.3);
    }

    .home {
      padding: 12px 22px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      color: #fff;
      font-size: 15px;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    .home:hover {
      background: #fff;
      color: #1f4f9a;
    }

    .home:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .sky { animation: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="stage">
    <h1 class="code" aria-label="404">
      <span aria-hidden="true">4</span>
      <span class="zero" id="zero" aria-hidden="true">
        <!-- Shown until the 3D tomato is ready, or if WebGL isn't available -->
        <img src="/assets/tomato.webp" alt="">
        <canvas id="tomato"></canvas>
      </span>
      <span aria-hidden="true">4</span>
    </h1>
    <p class="message">This page doesn't exist. Maybe it's still cooking.</p>
    <a class="home" href="/">Back to home</a>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const slot = document.getElementById('zero');
    const canvas = document.getElementById('tomato');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // The canvas spans 1.4x the slot; frame the camera so a 1-unit tomato fills the slot
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.z = 0.7 / Math.tan(THREE.MathUtils.degToRad(15));

    const spinner = new THREE.Group();
    scene.add(spinner);

    new GLTFLoader().load('/assets/tomato.glb', (gltf) => {
      const model = gltf.scene;
      // Center the model and normalize it to 1 unit (the model is unlit, so no lights)
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      model.position.sub(box.getCenter(new THREE.Vector3()));
      const holder = new THREE.Group();
      holder.add(model);
      holder.scale.setScalar(1 / Math.max(size.x, size.y, size.z));
      spinner.add(holder);
      slot.classList.add('ready');
    });

    function resize() {
      const { width, height } = canvas.getBoundingClientRect();
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(slot);
    resize();

    const clock = new THREE.Clock();
    function frame() {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      spinner.rotation.y += dt * (reduced ? 0.3 : 0.9);
      if (!reduced) {
        spinner.rotation.x = Math.sin(t * 0.8) * 0.15;
        spinner.rotation.z = Math.sin(t * 0.6) * 0.1;
        spinner.position.y = Math.sin(t * 1.4) * 0.04;
      }
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
