<main>
  <header class="st-head">
    <h1>Stamps</h1>
    <p>Send me a photo, drawing or illustration made by you and it becomes a stamp in this album, with the name you choose and the date.</p>
    <button type="button" class="st-send" id="st-send">Send your stamp</button>
  </header>

  <!-- EL ÁLBUM · cada sello es un <button class="stamp ...">. Para añadir uno, copia un bloque y cambia:
         forma:        is-p (vertical) · is-l (horizontal) · is-s (pequeño) · is-b (grande)
         composición:  lay-a (nombre arriba) · lay-b (banda abajo) · lay-c (nombre en vertical) · lay-d (número grande)
         texto claro:  añade t-light si la imagen es oscura (por defecto el texto es negro)
         imagen:       sustituye <span class="stamp-art"></span> por
                       <img class="stamp-art" src="/assets/stamps/007.webp" alt="Descripción de la imagen" loading="lazy">
         nombre, número (No. 007, seguido) y fecha de aprobación.
       El orden en el código = el orden en el álbum (los huecos se rellenan solos). Lo más nuevo, arriba.
       EJEMPLOS: los sellos de abajo son de muestra (color liso y nombres inventados). Bórralos al añadir los primeros de verdad. -->
  <section class="album" aria-label="Stamp album">
    <button type="button" class="stamp is-p lay-a" style="--c: #e5322d"><span class="stamp-face"><span class="stamp-art"></span><span class="stamp-name">Lucía</span><span class="stamp-no">No. 010</span><span class="stamp-date">20.10.2026</span><span class="stamp-site">dizmar.xyz</span></span></button>
    <button type="button" class="stamp is-p lay-c t-light" style="--c: #1f4e9b"><span class="stamp-face"><span class="stamp-art"></span><span class="stamp-name">Kenji</span><span class="stamp-no">No. 009</span><span class="stamp-date">18.10.2026</span><span class="stamp-site">dizmar.xyz</span></span></button>
    <button type="button" class="stamp is-l lay-b" style="--c: #f08a2b"><span class="stamp-face"><span class="stamp-art"></span><span class="stamp-name">Ana Martín</span><span class="stamp-no">No. 008</span><span class="stamp-date">15.10.2026</span><span class="stamp-site">dizmar.xyz</span></span></button>
    <button type="button" class="stamp is-b lay-d t-light" style="--c: #23a3a3"><span class="stamp-face"><span class="stamp-art"></span><span class="stamp-name">Tomás</span><span class="stamp-no">No. 007</span><span class="stamp-date">12.10.2026</span><span class="stamp-site">dizmar.xyz</span></span></button>
    <button type="button" class="stamp is-s lay-a" style="--c: #efe6d2"><span class="stamp-face"><span class="stamp-art"></span><span class="stamp-name">Iris</span><span class="stamp-no">No. 006</span><span class="stamp-date">09.10.2026</span><span class="stamp-site">dizmar.xyz</span></span></button>
    <button type="button" class="stamp is-p lay-d" style="--c: #c9a33a"><span class="stamp-face"><span class="stamp-art"></span><span class="stamp-name">Noor</span><span class="stamp-no">No. 005</span><span class="stamp-date">05.10.2026</span><span class="stamp-site">dizmar.xyz</span></span></button>
    <button type="button" class="stamp is-l lay-a t-light" style="--c: #111111"><span class="stamp-face"><span class="stamp-art"></span><span class="stamp-name">Pablo R.</span><span class="stamp-no">No. 004</span><span class="stamp-date">01.10.2026</span><span class="stamp-site">dizmar.xyz</span></span></button>
    <button type="button" class="stamp is-s lay-c" style="--c: #f2a7b4"><span class="stamp-face"><span class="stamp-art"></span><span class="stamp-name">Mei</span><span class="stamp-no">No. 003</span><span class="stamp-date">27.09.2026</span><span class="stamp-site">dizmar.xyz</span></span></button>
    <button type="button" class="stamp is-s lay-b t-light" style="--c: #3c7d4a"><span class="stamp-face"><span class="stamp-art"></span><span class="stamp-name">Jorge</span><span class="stamp-no">No. 002</span><span class="stamp-date">24.09.2026</span><span class="stamp-site">dizmar.xyz</span></span></button>
    <button type="button" class="stamp is-s lay-d t-light" style="--c: #7a4bd1"><span class="stamp-face"><span class="stamp-art"></span><span class="stamp-name">Sara</span><span class="stamp-no">No. 001</span><span class="stamp-date">20.09.2026</span><span class="stamp-site">dizmar.xyz</span></span></button>
  </section>

<!-- Un sello en grande (se abre al pulsar uno) -->
<dialog class="st-dialog st-viewer" id="st-viewer" aria-label="Stamp">
  <div class="st-viewer-slot"></div>
  <button type="button" class="st-close" data-close aria-label="Close">Close</button>
</dialog>

<!-- El formulario para enviar un sello. El de Tally se carga solo al pulsar "Send your stamp" (ver js/stamps.js) -->
<dialog class="st-dialog st-form" id="st-form" aria-label="Send your stamp">
  <div class="st-form-slot"><p class="st-soon">The form is coming soon.</p></div>
  <button type="button" class="st-close" data-close aria-label="Close">Close</button>
</dialog>

</html>
